# Local dev dependencies only. The backend and frontend run on the host.
# Postgres major version is 17 to match what the Supabase project provisions.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: rewind
      POSTGRES_DB: rewind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewind -d rewind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
