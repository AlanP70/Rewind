# Render Blueprint — the deploy topology, in the repo instead of in a dashboard.
#
# ONE service, running two processes. Phase 2 split the backend into an API that
# enqueues and an arq worker that does the work, and the obvious deploy is two
# Render services. It is not what this does, because `type: worker` is not offered
# on Render's free instance type and a second paid service is not worth it for a
# project with no users. `backend/start.sh` runs uvicorn and arq side by side
# under one process supervisor instead.
#
# What that costs, and what buying the split back looks like, is in ROADMAP under
# "Corrected after the phase closed". The short version: the worker sleeps when
# the free instance spins down, both processes share 512MB, and either one dying
# takes the container with it — deliberately, because the alternative is a green
# dashboard over a queue that silently stopped draining.
#
# BEFORE THE FIRST APPLY:
#
# A blueprint does not adopt services created by hand in the dashboard; it creates
# its own alongside them. The Phase 0 web service was created by hand, so it has
# to be deleted first for this file to own the deploy — and deleting it changes
# the service's onrender.com hostname, which the Vercel frontend has baked into
# NEXT_PUBLIC_API_URL at build time. Copy the existing env var values out before
# deleting; they are not recoverable afterwards.
#
# The Key Value instance is deliberately NOT declared. It already exists, and a
# blueprint entry for it would provision a second empty one rather than adopt it,
# leaving REDIS_URL pointing at an idle Redis while the real queue sat elsewhere.

services:
  - type: web
    name: rewind-api
    runtime: docker
    plan: free
    # Must match the Key Value instance's region. The internal Redis URL resolves
    # inside one region only — across regions it fails with `gaierror` on a
    # hostname that is otherwise perfectly correct, so it reads as a bad
    # REDIS_URL rather than as a topology mistake. Fixed at creation, so getting
    # it wrong means recreating the instance. Confirmed oregon, 2026-08-10.
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # No dockerCommand. The Dockerfile's CMD is start.sh, and Render's Docker
    # Command field cannot be trusted to parse a compound command — leaving this
    # unset is how the script wins. Left commented rather than set empty — an
    # explicit null here is a value, and the point is that there is no value.
    # dockerCommand:

    # 503 when a dependency is down, which is the whole reason the route exists:
    # always-200 means a dead Postgres reads as a healthy deploy. Note it does not
    # cover the worker — nothing served over HTTP can, since the worker shares
    # this process tree but not its request path. A queue that has stopped
    # draining shows up as `stale` on the document status endpoint, not here.
    healthCheckPath: /health/ready

    envVars:
      # `sync: false` means Render prompts once and then keeps the dashboard
      # value — the blueprint records that the variable is required without
      # putting the secret in git.
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false

      # The Key Value instance's *Internal* URL: `redis://red-xxxxxxxx:6379`, no
      # password, same region as above. The external URL is `rediss://` with a
      # password over the public internet — TLS and egress on every call for a
      # connection that never needs to leave Render's network.
      - key: REDIS_URL
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      # Not `local`, even though one service now means one filesystem and a local
      # path would technically work. Render's disks are ephemeral: every deploy
      # replaces the container, and every uploaded PDF would go with it while the
      # `documents` rows pointing at them survived.
      - key: STORAGE_BACKEND
        value: supabase
      - key: STORAGE_BUCKET
        value: documents
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # The Vercel origin, comma-separated.
      - key: CORS_ORIGINS
        sync: false
