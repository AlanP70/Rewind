[project]
name = "rewind-backend"
version = "0.1.0"
description = "Rewind backend — longitudinal learning archive"
# Pinned to 3.12: the system interpreter is 3.14 and is not used. uv provisions this.
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    # asyncpg for the app, sync psycopg for Alembic.
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    # Supplies the SQLAlchemy Vector column type that maps to pgvector.
    "pgvector>=0.3",
    # Exact pins, not floors. A bump changes extracted text without erroring,
    # which silently shifts every stored char offset — and per invariant 3 those
    # cannot be backfilled. Both are pinned because pdfminer.six is what actually
    # produces the text; pdfplumber only wraps it. Bump by hand, then re-ingest
    # and run `verify`.
    "pdfplumber==0.11.10",
    "pdfminer-six==20260107",
    "openai>=2.53.0",
    # Supabase Storage is two REST endpoints, which does not justify the
    # `supabase` client. httpx is already in the tree under openai; it is
    # declared here because this code calls it directly.
    "httpx>=0.28",
    # The job queue. Not Celery: arq is asyncio-native, so the worker calls the
    # same async services the routes do instead of needing a sync mirror of them.
    "arq>=0.26",
]

[tool.uv]
# This is an application, not a library — nothing imports it, so it is not built.
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "pytest>=9.1.1",
    # Services are async, so tests of them have to be. The alternative is
    # wrapping every test body in asyncio.run(), which is the same thing with
    # more ceremony.
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
# Every async test in this suite wants to be one; marking each individually is
# noise.
asyncio_mode = "auto"
# `package = false` above means nothing installs `app` into the environment, so
# pytest has to be told where it is.
pythonpath = ["."]
